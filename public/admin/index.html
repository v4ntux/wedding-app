<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>nvate · admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ночь и золото — та же система, что в студии и приглашениях. */
  --milk:#05040a;--paper:rgba(255,248,232,.055);--mist:rgba(255,248,232,.09);
  --wisteria:#e6cf9a;--lilac:#d8b878;--lilac-d:#8a6a2f;
  --ink:#f7efdd;--soft:#a99e8b;--gold:#e6cf9a;--line:rgba(230,207,154,.18);
  --ok:#93c08d;--new:#e2c583;--err:#e08c99;--shadow:0 26px 60px -34px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--milk);color:var(--ink);font-family:'Manrope','Segoe UI',sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60vw 40vh at 90% -8%,rgba(198,176,227,.28),transparent 60%),
  radial-gradient(50vw 40vh at -10% 20%,rgba(244,222,200,.34),transparent 60%)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.head{display:flex;align-items:center;gap:10px;margin:12px 0 22px;flex-wrap:wrap}
.head h1{font-family:'Prata',serif;font-weight:400;font-size:1.7rem}
.head h1 i{font-style:normal;color:var(--gold)}
.head h1 span{font-family:'Manrope';font-size:.9rem;color:var(--soft)}
.head .spacer{flex:1}
.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang-switch button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:inherit;font-size:.76rem;font-weight:600;color:var(--soft)}
.lang-switch button.on{background:var(--lilac);color:#fff}
.refresh{border:1px solid var(--line);background:var(--paper);color:var(--lilac);border-radius:999px;padding:7px 14px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
h2{font-family:'Prata',serif;font-weight:400;font-size:1.1rem;margin:26px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.kpi .v{font-family:'Prata',serif;font-size:1.5rem;line-height:1.1;color:var(--lilac)}
.kpi .l{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.kpi.k-rev .v{color:var(--gold)} .kpi.wide{grid-column:span 2}
.kpi .badge{display:inline-block;font-size:.66rem;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:8px}
.b-paid{background:#E4EFE2;color:var(--ok)} .b-new{background:#F6EFD9;color:var(--new)} .b-cnl{background:#F4E0E3;color:var(--err)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
.row .nm{flex:0 0 92px;font-size:.86rem;font-weight:600}
.row .track{flex:1;height:22px;background:var(--mist);border-radius:8px;overflow:hidden}
.row .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--wisteria),var(--lilac));min-width:2px;transition:width .8s cubic-bezier(.22,.61,.36,1)}
.row .val{flex:0 0 auto;font-size:.78rem;color:var(--soft);white-space:nowrap;min-width:92px;text-align:right}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.day .bar{width:100%;max-width:26px;border-radius:6px 6px 0 0;background:var(--mist);position:relative;min-height:3px;transition:height .8s cubic-bezier(.22,.61,.36,1)}
.day .bar .paid{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--lilac),var(--lilac-d))}
.day .d{font-size:.6rem;color:var(--soft);transform:rotate(-45deg);white-space:nowrap}
.legend{display:flex;gap:16px;font-size:.74rem;color:var(--soft);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.mline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.mline:last-child{border-bottom:0}
.mline .n{flex:0 0 22px;font-family:'Prata',serif;color:var(--gold)}
.mline .t{flex:1;min-width:0}.mline .t b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mline .t span{font-size:.74rem;color:var(--soft)}.mline .c{font-size:.8rem;color:var(--soft)}
/* Orders */
.order{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--paper);box-shadow:var(--shadow)}
.order-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.order-h .nm{font-family:'Prata',serif;font-size:1.02rem}
.order-meta{font-size:.8rem;color:var(--soft);margin-top:4px}
.order-conf{font-size:.8rem;margin-top:8px;padding:8px 10px;border-radius:10px;background:#EEF5EC;color:#4C6F49}
.order-conf b{color:#3B5A38}
.order-proof{display:inline-block;margin-top:8px}
.order-proof img{max-width:120px;border-radius:8px;border:1px solid var(--line)}
.order-guests{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.gtag{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:4px 10px;border-radius:999px;background:var(--mist);color:var(--ink)}
.gtag.sent{background:#E4EFE2;color:var(--ok)}
.badge{font-size:.68rem;font-weight:600;border-radius:999px;padding:3px 11px;white-space:nowrap}
.empty{color:var(--soft);font-size:.9rem;text-align:center;padding:20px}
.err-screen{text-align:center;padding:60px 20px;color:var(--soft)}.err-screen .big{font-size:2.4rem;margin-bottom:10px}

/* ── Ночное стекло ──────────────────────────────────────────────────── */
body{background:
  radial-gradient(120% 60% at 50% -10%,rgba(230,207,154,.16),transparent 58%),
  radial-gradient(70% 46% at 6% 70%,rgba(44,44,68,.5),transparent 72%),
  linear-gradient(180deg,#0b0a12 0%,#05040a 56%,#020204 100%);
  background-attachment:fixed}
#glow{background:radial-gradient(60vw 40vh at 88% -6%,rgba(230,207,154,.16),transparent 62%),
  radial-gradient(50vw 40vh at -8% 24%,rgba(120,96,52,.18),transparent 62%)}
.kpi,.card,.order{
  border:1px solid var(--line);
  background:linear-gradient(158deg,rgba(255,248,232,.09),rgba(255,240,214,.03) 46%,rgba(5,4,8,.2));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,252,244,.22);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.kpi .v,.mline .n{color:var(--gold)}
.row .track,.day .bar{background:rgba(255,248,232,.09)}
.row .fill,.day .bar .paid{background:linear-gradient(90deg,var(--lilac-d),var(--gold))}
.lang-switch{border-color:var(--line)}
.lang-switch button.on{background:linear-gradient(112deg,var(--lilac-d),var(--gold));color:#170f02}
.refresh{background:linear-gradient(160deg,rgba(255,249,234,.1),rgba(255,240,214,.03));color:var(--gold)}
.b-paid{background:rgba(147,192,141,.16);color:var(--ok)}
.b-new{background:rgba(226,197,131,.16);color:var(--new)}
.b-cnl{background:rgba(224,140,153,.16);color:var(--err)}
.gtag{background:rgba(255,248,232,.08);color:var(--ink)}
.gtag.sent{background:rgba(147,192,141,.16);color:var(--ok)}
.order-conf{background:rgba(147,192,141,.12);color:#cfe6cb}
.order-conf b{color:#e8f3e6}
.order-proof img{border-color:var(--line)}
.head h1 i{color:var(--gold)}

/* ── Вкладки и управление ───────────────────────────────────────────── */
.tabs{display:flex;gap:6px;margin:18px 0 4px;padding:4px;border:1px solid var(--line);border-radius:999px;
  background:linear-gradient(158deg,rgba(255,248,232,.07),rgba(5,4,8,.2))}
.tabs button{flex:1;min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--soft);
  font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:color .3s ease,background .3s ease}
.tabs button.on{color:#170f02;background:linear-gradient(112deg,var(--lilac-d),var(--gold))}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.filters button{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--soft);font:inherit;font-size:.78rem;cursor:pointer}
.filters button.on{color:var(--gold);border-color:var(--gold);background:rgba(230,207,154,.1)}
.order-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:transform .15s ease,background .3s ease}
.act:active{transform:scale(.97)}
.act[disabled]{opacity:.45;cursor:default}
.act--pay{color:#170f02;border-color:transparent;background:linear-gradient(112deg,var(--lilac-d),var(--gold))}
.act--cancel{color:var(--err);border-color:rgba(224,140,153,.4)}
.act--link{color:var(--gold);border-color:rgba(230,207,154,.35)}
.order-contacts{margin-top:8px;font-size:.8rem;color:var(--soft);word-break:break-word}
.price-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.price-row:last-child{border-bottom:0}
.price-row .nm{flex:1;min-width:0;font-size:.9rem;font-weight:600}
.price-row .nm em{display:block;font-style:normal;font-size:.72rem;font-weight:400;color:var(--soft)}
.price-row input{width:130px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,248,232,.06);color:var(--ink);font:inherit;font-size:.9rem;text-align:right}
.price-row input:focus{outline:0;border-color:var(--gold);background:rgba(230,207,154,.1)}
.price-save{display:flex;align-items:center;gap:12px;margin-top:16px}
.note{margin-top:10px;font-size:.78rem;color:var(--soft);line-height:1.5}
.saved{color:var(--ok);font-size:.82rem}
</style>
</head>
<body>
<div id="glow" aria-hidden="true"></div>
<div class="wrap">
  <div class="head">
    <h1>nvate<i>.</i> <span>admin</span></h1>
    <div class="spacer"></div>
    <div class="lang-switch"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button></div>
    <button class="refresh" id="refresh"></button>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="overview"></button>
    <button data-tab="orders"></button>
    <button data-tab="pricing"></button>
  </div>
  <div id="content"><div class="empty">…</div></div>
</div>

<script type="module">
'use strict';
import { escapeHtml as esc } from './sanitize.js';
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
const money = (n) => Number(n || 0).toLocaleString('ru-RU') + ' ' + t('sum');
const initData = () => (tg ? tg.initData : '');

const I18N = {
  uz: {
    refresh:'↻ Yangilash', sum:'so‘m',
    tabOverview:'Ko‘rsatkichlar', tabOrders:'Arizalar', tabPricing:'Narxlar',
    kAll:'Jami arizalar', kPaid:'To‘langan', kNew:'Kutilmoqda', kCancel:'Rad etilgan',
    kRev:'Tushum', kConv:'Konversiya', kAvg:'O‘rtacha chek', kGuests:'Nomli havolalar', kGuestRev:'Ulardan tushum',
    hTpl:'Shablonlar', hDays:'So‘nggi kunlar', hMusic:'Top musiqa', hOrders:'Buyurtmalar',
    legReq:'Arizalar', legPaid:'To‘langan',
    stNew:'⏳ Kutilmoqda', stPaid:'✅ Tayyor', stCancel:'✖ Rad etilgan',
    confBy:'Tasdiqladi', proof:'Chek', noMusic:'Katalogdan musiqa hali tanlanmagan',
    noData:'Hozircha ma’lumot yo‘q', noOrders:'Hozircha buyurtmalar yo‘q',
    sent:'yuborildi', notSent:'yuborilmagan',
    forbidden:'Faqat administrator uchun. Botdagi tugma orqali oching.',
    loadErr:'Yuklashda xato. Qayta urinib ko‘ring.',
    fAll:'Hammasi', fNew:'Kutilmoqda', fPaid:'To‘langan', fCancel:'Rad etilgan',
    pay:'To‘lovni tasdiqlash', cancel:'Rad etish', openLink:'Havolani ochish',
    payAsk:'Arizani tasdiqlaysizmi? Juftlikka havola yuboriladi.',
    cancelAsk:'Arizani rad etasizmi?',
    payOk:'Tasdiqlandi. Havola yuborildi.', cancelOk:'Ariza rad etildi.',
    priceTpl:'Shablon narxlari', priceOther:'Boshqa xizmatlar',
    guestLink:'Nomli havola (1 mehmon)', save:'Saqlash', saved:'Saqlandi ✓',
    factory:'zavod narxi', priceNote:'Bo‘sh maydon — zavod narxiga qaytaradi. Narx faqat yangi arizalarga ta’sir qiladi.',
    contacts:'Aloqa',
  },
  ru: {
    refresh:'↻ Обновить', sum:'сум',
    tabOverview:'Показатели', tabOrders:'Заявки', tabPricing:'Цены',
    kAll:'Всего заявок', kPaid:'Оплачено', kNew:'Ожидают', kCancel:'Отклонено',
    kRev:'Выручка', kConv:'Конверсия', kAvg:'Средний чек', kGuests:'Именных ссылок', kGuestRev:'Из них выручка',
    hTpl:'Шаблоны', hDays:'Последние дни', hMusic:'Топ музыки', hOrders:'Заказы',
    legReq:'Заявки', legPaid:'Оплачено',
    stNew:'⏳ Ожидает', stPaid:'✅ Готово', stCancel:'✖ Отклонено',
    confBy:'Подтвердил', proof:'Чек', noMusic:'Музыку из каталога пока не выбирали',
    noData:'Пока нет данных', noOrders:'Пока нет заказов',
    sent:'отправлено', notSent:'не отправлено',
    forbidden:'Только для администратора. Откройте через кнопку в боте.',
    loadErr:'Ошибка загрузки. Попробуйте ещё раз.',
    fAll:'Все', fNew:'Ожидают', fPaid:'Оплачены', fCancel:'Отклонены',
    pay:'Подтвердить оплату', cancel:'Отклонить', openLink:'Открыть ссылку',
    payAsk:'Подтвердить оплату? Паре уйдёт ссылка на приглашение.',
    cancelAsk:'Отклонить заявку?',
    payOk:'Подтверждено. Ссылка отправлена паре.', cancelOk:'Заявка отклонена.',
    priceTpl:'Цены шаблонов', priceOther:'Другие услуги',
    guestLink:'Именная ссылка (1 гость)', save:'Сохранить', saved:'Сохранено ✓',
    factory:'заводская', priceNote:'Пустое поле возвращает заводскую цену. Новая цена применяется к новым заявкам — уже созданные заказы сохраняют свою сумму.',
    contacts:'Контакты',
  },
};
let LANG = localStorage.getItem('nv_admin_lang') || 'uz';
const t = (k) => (I18N[LANG][k] ?? k);
let DATA = null;
let TAB = localStorage.getItem('nv_admin_tab') || 'overview';
let FILTER = 'all';
let proofObjectUrls = [];

function kpi(v, l, cls, badge){ return `<div class="kpi ${cls||''}"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div>${badge||''}</div>`; }

function statusBadge(s){
  if (s==='paid') return `<span class="badge b-paid">${t('stPaid')}</span>`;
  if (s==='cancelled') return `<span class="badge b-cnl">${t('stCancel')}</span>`;
  return `<span class="badge b-new">${t('stNew')}</span>`;
}

function templateNames(){
  const names = Object.create(null);
  for (const x of (DATA?.templates||[])) names[x.id]=x.name;
  return names;
}

/* ── Вкладка «Показатели» ── */
function renderOverview(){
  const s = DATA.stats, T = s.totals, names = templateNames();
  let h = '<div class="kpis">';
  h += kpi(T.all, t('kAll'));
  h += kpi(T.paid, t('kPaid'), '', '<span class="badge b-paid">✓</span>');
  h += kpi(T.new, t('kNew'), '', '<span class="badge b-new">⏳</span>');
  h += kpi(T.cancelled, t('kCancel'), '', '<span class="badge b-cnl">✕</span>');
  h += '</div><div class="kpis" style="margin-top:12px">';
  h += kpi(money(T.revenue), t('kRev'), 'k-rev wide');
  h += kpi(T.conversion+'%', t('kConv'));
  h += kpi(money(T.avgCheck), t('kAvg'));
  h += '</div><div class="kpis" style="margin-top:12px">';
  h += kpi(s.guestLinks, t('kGuests'));
  h += kpi(money(s.premiumRevenue), t('kGuestRev'), 'k-rev');
  h += '</div>';

  const maxT = Math.max(1, ...s.templates.map(x=>x.count));
  h += `<h2>${esc(t('hTpl'))}</h2><div class="card">`;
  if (!s.templates.length) h += `<div class="empty">${esc(t('noData'))}</div>`;
  for (const x of s.templates) h += `<div class="row"><div class="nm">${esc(names[x.id]||x.id)}</div>
    <div class="track"><div class="fill" style="width:${(x.count/maxT*100).toFixed(1)}%"></div></div>
    <div class="val">${esc(x.count)} · ${esc(money(x.revenue))}</div></div>`;
  h += '</div>';

  h += `<h2>${esc(t('hDays'))}</h2><div class="card">`;
  if (!s.byDay.length) h += `<div class="empty">${esc(t('noData'))}</div>`;
  else {
    const maxD = Math.max(1, ...s.byDay.map(d=>d.count));
    h += '<div class="days">';
    for (const d of s.byDay){ const hh=(d.count/maxD*100).toFixed(0); const ph=d.count?(d.paid/d.count*100).toFixed(0):0;
      h += `<div class="day" title="${esc(`${d.day}: ${d.count} / ${d.paid}`)}"><div class="bar" style="height:${hh}%"><div class="paid" style="height:${ph}%"></div></div><div class="d">${esc(String(d.day).slice(5))}</div></div>`; }
    h += `</div><div class="legend"><span><i class="dot" style="background:var(--mist)"></i>${esc(t('legReq'))}</span><span><i class="dot" style="background:var(--lilac)"></i>${esc(t('legPaid'))}</span></div>`;
  }
  h += '</div>';

  h += `<h2>${esc(t('hMusic'))}</h2><div class="card">`;
  if (!s.topMusic.length) h += `<div class="empty">${esc(t('noMusic'))}</div>`;
  s.topMusic.forEach((m,i)=>{ h += `<div class="mline"><span class="n">${i+1}</span><div class="t"><b>${esc(m.name)}</b><span>${esc(m.artist)}</span></div><span class="c">${esc(m.count)}×</span></div>`; });
  h += '</div>';
  return h;
}

/* ── Вкладка «Заявки»: чек, контакты и два действия ── */
function renderOrders(){
  const names = templateNames();
  const all = DATA.orders || [];
  const orders = FILTER==='all' ? all : all.filter(o=>o.status===FILTER);
  let h = '<div class="filters">';
  for (const [key,label] of [['all','fAll'],['new','fNew'],['paid','fPaid'],['cancelled','fCancel']]) {
    const count = key==='all' ? all.length : all.filter(o=>o.status===key).length;
    h += `<button data-filter="${key}" class="${FILTER===key?'on':''}">${esc(t(label))} · ${count}</button>`;
  }
  h += '</div>';

  if (!orders.length) return h + `<div class="card"><div class="empty">${esc(t('noOrders'))}</div></div>`;

  for (const o of orders){
    h += `<div class="order"><div class="order-h"><div><div class="nm">#${esc(o.id)} · ${esc(o.groom)} &amp; ${esc(o.bride)}</div>
      <div class="order-meta">${esc(o.date)} · ${esc(names[o.templateId]||o.templateId)} · ${esc(money(o.total))}</div></div>${statusBadge(o.status)}</div>`;
    const contacts = [o.contactTg ? '@'+String(o.contactTg).replace(/^@/,'') : '', o.phone, o.phone2].filter(Boolean);
    if (contacts.length) h += `<div class="order-contacts">${esc(t('contacts'))}: ${esc(contacts.join(' · '))}</div>`;
    if (o.status==='paid' && (o.confirmedByName || o.paidAt)) {
      h += `<div class="order-conf">✅ ${esc(t('confBy'))}: <b>${esc(o.confirmedByName||'—')}</b>${o.paidAt?` · ${esc(o.paidAt)}`:''}</div>`;
    }
    if (o.paymentProof) h += `<a class="order-proof" data-proof-link href="#" target="_blank" rel="noopener"><img data-proof-src="${esc(o.paymentProof)}" alt="${esc(t('proof'))}"></a>`;
    if (o.guests && o.guests.length){
      h += '<div class="order-guests">';
      for (const g of o.guests) h += `<span class="gtag ${g.sent?'sent':''}">${g.sent?'✅':'⚪'} ${esc(g.name)}</span>`;
      h += '</div>';
    }
    h += '<div class="order-acts">';
    if (o.status==='new'){
      h += `<button class="act act--pay" data-pay="${esc(o.id)}">${esc(t('pay'))}</button>`;
      h += `<button class="act act--cancel" data-cancel="${esc(o.id)}">${esc(t('cancel'))}</button>`;
    }
    if (o.status==='paid' && o.slug){
      h += `<a class="act act--link" href="/${esc(o.slug)}" target="_blank" rel="noopener">${esc(t('openLink'))}</a>`;
    }
    h += '</div></div>';
  }
  return h;
}

/* ── Вкладка «Цены» ── */
function renderPricing(){
  const p = DATA.pricing;
  let h = `<h2>${esc(t('priceTpl'))}</h2><div class="card">`;
  for (const tpl of p.templates){
    h += `<div class="price-row"><div class="nm">${esc(tpl.name)}<em>${esc(t('factory'))}: ${esc(money(tpl.defaultPrice))}</em></div>
      <input type="number" inputmode="numeric" min="0" step="1000" data-price-template="${esc(tpl.id)}" value="${esc(tpl.price)}" placeholder="${esc(tpl.defaultPrice)}"></div>`;
  }
  h += '</div>';

  h += `<h2>${esc(t('priceOther'))}</h2><div class="card">`;
  h += `<div class="price-row"><div class="nm">${esc(t('guestLink'))}<em>${esc(t('factory'))}: ${esc(money(p.guestLink.defaultPrice))}</em></div>
    <input type="number" inputmode="numeric" min="0" step="1000" data-price-guest value="${esc(p.guestLink.price)}" placeholder="${esc(p.guestLink.defaultPrice)}"></div>`;
  for (const addon of p.addons){
    h += `<div class="price-row"><div class="nm">${esc(LANG==='ru'?addon.ru:addon.uz)}<em>${esc(t('factory'))}: ${esc(money(addon.defaultPrice))}</em></div>
      <input type="number" inputmode="numeric" min="0" step="1000" data-price-addon="${esc(addon.id)}" value="${esc(addon.price)}" placeholder="${esc(addon.defaultPrice)}"></div>`;
  }
  h += '</div>';
  h += `<div class="price-save"><button class="act act--pay" id="price-save">${esc(t('save'))}</button><span class="saved" id="price-saved" hidden>${esc(t('saved'))}</span></div>`;
  h += `<p class="note">${esc(t('priceNote'))}</p>`;
  return h;
}

function render(){
  if (!DATA) return;
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===TAB);
    b.textContent = t(b.dataset.tab==='overview'?'tabOverview':b.dataset.tab==='orders'?'tabOrders':'tabPricing');
  });
  $('content').innerHTML = TAB==='orders' ? renderOrders() : TAB==='pricing' ? renderPricing() : renderOverview();
  if (TAB==='orders') loadProofs();
}

async function loadProofs(){
  proofObjectUrls.forEach((url)=>URL.revokeObjectURL(url));
  proofObjectUrls = [];
  for (const img of document.querySelectorAll('img[data-proof-src]')) {
    try {
      const response = await fetch(img.dataset.proofSrc, { headers:{ 'X-Init-Data': initData() } });
      if (!response.ok) continue;
      const objectUrl = URL.createObjectURL(await response.blob());
      proofObjectUrls.push(objectUrl);
      img.src = objectUrl;
      const link = img.closest('[data-proof-link]');
      if (link) link.href = objectUrl;
    } catch (_) { /* чек остаётся скрытым, если доступ не подтверждён */ }
  }
}

async function load(){
  $('content').innerHTML = '<div class="empty">…</div>';
  try {
    const res = await fetch('/api/admin/overview', { headers:{ 'X-Init-Data': initData() } });
    if (res.status===403){ $('content').innerHTML = `<div class="err-screen"><div class="big">🔒</div>${t('forbidden')}</div>`; return; }
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error();
    DATA = data; render();
  } catch(e){ $('content').innerHTML = `<div class="err-screen"><div class="big">📡</div>${t('loadErr')}</div>`; }
}

/* Действия над заявкой: подтверждение необратимо, поэтому спрашиваем. */
async function act(id, kind){
  const ask = kind==='pay' ? t('payAsk') : t('cancelAsk');
  if (!confirm(ask)) return;
  const button = document.querySelector(`[data-${kind}="${id}"]`);
  if (button) button.disabled = true;
  try {
    const res = await fetch(`/api/admin/applications/${id}/${kind}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Init-Data': initData() },
      body:'{}',
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'error');
    alert(kind==='pay' ? t('payOk') : t('cancelOk'));
    await load();
  } catch(e){
    alert(e.message || t('loadErr'));
    if (button) button.disabled = false;
  }
}

async function savePricing(){
  const patch = { templates:{}, addons:{} };
  document.querySelectorAll('[data-price-template]').forEach(i=>{ patch.templates[i.dataset.priceTemplate] = i.value===''?null:Number(i.value); });
  document.querySelectorAll('[data-price-addon]').forEach(i=>{ patch.addons[i.dataset.priceAddon] = i.value===''?null:Number(i.value); });
  const guest = document.querySelector('[data-price-guest]');
  patch.guestLink = guest && guest.value!=='' ? Number(guest.value) : null;
  const button = $('price-save');
  button.disabled = true;
  try {
    const res = await fetch('/api/admin/pricing', {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Init-Data': initData() },
      body: JSON.stringify(patch),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'error');
    DATA.pricing = data.pricing;
    $('price-saved').hidden = false;
    setTimeout(()=>{ const el=$('price-saved'); if (el) el.hidden = true; }, 2600);
  } catch(e){
    alert(e.message || t('loadErr'));
  } finally {
    button.disabled = false;
  }
}

document.addEventListener('click', (e)=>{
  const tab = e.target.closest('#tabs button');
  if (tab){ TAB = tab.dataset.tab; localStorage.setItem('nv_admin_tab', TAB); render(); return; }
  const filter = e.target.closest('[data-filter]');
  if (filter){ FILTER = filter.dataset.filter; render(); return; }
  const pay = e.target.closest('[data-pay]');
  if (pay){ act(pay.dataset.pay, 'pay'); return; }
  const cancel = e.target.closest('[data-cancel]');
  if (cancel){ act(cancel.dataset.cancel, 'cancel'); return; }
  if (e.target.closest('#price-save')) savePricing();
});

function applyLang(){
  document.documentElement.lang = LANG;
  $('refresh').textContent = t('refresh');
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  render();
}
document.querySelectorAll('.lang-switch button').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.lang; localStorage.setItem('nv_admin_lang',LANG); applyLang(); }));
$('refresh').addEventListener('click', load);
applyLang();
load();
</script>
</body>
</html>
