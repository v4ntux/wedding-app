<style>
:root{
  /* Ночь и золото — та же система, что в студии и приглашениях. */
  --milk:#05040a;--paper:rgba(255,248,232,.055);--mist:rgba(255,248,232,.09);
  --wisteria:#e6cf9a;--lilac:#d8b878;--lilac-d:#8a6a2f;
  --ink:#f7efdd;--soft:#a99e8b;--gold:#e6cf9a;--line:rgba(230,207,154,.18);
  --ok:#93c08d;--new:#e2c583;--err:#e08c99;--shadow:0 26px 60px -34px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--milk);color:var(--ink);font-family:'Manrope','Segoe UI',sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60vw 40vh at 90% -8%,rgba(198,176,227,.28),transparent 60%),
  radial-gradient(50vw 40vh at -10% 20%,rgba(244,222,200,.34),transparent 60%)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.head{display:flex;align-items:center;gap:10px;margin:12px 0 22px;flex-wrap:wrap}
.head h1{font-family:'Prata',serif;font-weight:400;font-size:1.7rem}
.head h1 i{font-style:normal;color:var(--gold)}
.head h1 span{font-family:'Manrope';font-size:.9rem;color:var(--soft)}
.head .spacer{flex:1}
.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang-switch button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font:inherit;font-size:.76rem;font-weight:600;color:var(--soft)}
.lang-switch button.on{background:var(--lilac);color:#fff}
.refresh{border:1px solid var(--line);background:var(--paper);color:var(--lilac);border-radius:999px;padding:7px 14px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
h2{font-family:'Prata',serif;font-weight:400;font-size:1.1rem;margin:26px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.kpi .v{font-family:'Prata',serif;font-size:1.5rem;line-height:1.1;color:var(--lilac)}
.kpi .l{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.kpi.k-rev .v{color:var(--gold)} .kpi.wide{grid-column:span 2}
.kpi .badge{display:inline-block;font-size:.66rem;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:8px}
.b-paid{background:#E4EFE2;color:var(--ok)} .b-new{background:#F6EFD9;color:var(--new)} .b-cnl{background:#F4E0E3;color:var(--err)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
.row .nm{flex:0 0 92px;font-size:.86rem;font-weight:600}
.row .track{flex:1;height:22px;background:var(--mist);border-radius:8px;overflow:hidden}
.row .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--wisteria),var(--lilac));min-width:2px;transition:width .8s cubic-bezier(.22,.61,.36,1)}
.row .val{flex:0 0 auto;font-size:.78rem;color:var(--soft);white-space:nowrap;min-width:92px;text-align:right}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.day .bar{width:100%;max-width:26px;border-radius:6px 6px 0 0;background:var(--mist);position:relative;min-height:3px;transition:height .8s cubic-bezier(.22,.61,.36,1)}
.day .bar .paid{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--lilac),var(--lilac-d))}
.day .d{font-size:.6rem;color:var(--soft);transform:rotate(-45deg);white-space:nowrap}
.legend{display:flex;gap:16px;font-size:.74rem;color:var(--soft);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.mline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.mline:last-child{border-bottom:0}
.mline .n{flex:0 0 22px;font-family:'Prata',serif;color:var(--gold)}
.mline .t{flex:1;min-width:0}.mline .t b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mline .t span{font-size:.74rem;color:var(--soft)}.mline .c{font-size:.8rem;color:var(--soft)}
/* Orders */
.order{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--paper);box-shadow:var(--shadow)}
.order-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.order-h .nm{font-family:'Prata',serif;font-size:1.02rem}
.order-meta{font-size:.8rem;color:var(--soft);margin-top:4px}
.order-conf{font-size:.8rem;margin-top:8px;padding:8px 10px;border-radius:10px;background:#EEF5EC;color:#4C6F49}
.order-conf b{color:#3B5A38}
.order-proof{display:inline-block;margin-top:8px}
.order-proof img{max-width:120px;border-radius:8px;border:1px solid var(--line)}
.order-guests{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.gtag{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:4px 10px;border-radius:999px;background:var(--mist);color:var(--ink)}
.gtag.sent{background:#E4EFE2;color:var(--ok)}
.badge{font-size:.68rem;font-weight:600;border-radius:999px;padding:3px 11px;white-space:nowrap}
.empty{color:var(--soft);font-size:.9rem;text-align:center;padding:20px}
.err-screen{text-align:center;padding:60px 20px;color:var(--soft)}.err-screen .big{font-size:2.4rem;margin-bottom:10px}

/* ── Ночное стекло ──────────────────────────────────────────────────── */
body{background:
  radial-gradient(120% 60% at 50% -10%,rgba(230,207,154,.16),transparent 58%),
  radial-gradient(70% 46% at 6% 70%,rgba(44,44,68,.5),transparent 72%),
  linear-gradient(180deg,#0b0a12 0%,#05040a 56%,#020204 100%);
  background-attachment:fixed}
#glow{background:radial-gradient(60vw 40vh at 88% -6%,rgba(230,207,154,.16),transparent 62%),
  radial-gradient(50vw 40vh at -8% 24%,rgba(120,96,52,.18),transparent 62%)}
.kpi,.card,.order{
  border:1px solid var(--line);
  background:linear-gradient(158deg,rgba(255,248,232,.09),rgba(255,240,214,.03) 46%,rgba(5,4,8,.2));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,252,244,.22);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.kpi .v,.mline .n{color:var(--gold)}
.row .track,.day .bar{background:rgba(255,248,232,.09)}
.row .fill,.day .bar .paid{background:linear-gradient(90deg,var(--lilac-d),var(--gold))}
.lang-switch{border-color:var(--line)}
.lang-switch button.on{background:linear-gradient(112deg,var(--lilac-d),var(--gold));color:#170f02}
.refresh{background:linear-gradient(160deg,rgba(255,249,234,.1),rgba(255,240,214,.03));color:var(--gold)}
.b-paid{background:rgba(147,192,141,.16);color:var(--ok)}
.b-new{background:rgba(226,197,131,.16);color:var(--new)}
.b-cnl{background:rgba(224,140,153,.16);color:var(--err)}
.gtag{background:rgba(255,248,232,.08);color:var(--ink)}
.gtag.sent{background:rgba(147,192,141,.16);color:var(--ok)}
.order-conf{background:rgba(147,192,141,.12);color:#cfe6cb}
.order-conf b{color:#e8f3e6}
.order-proof img{border-color:var(--line)}
.head h1 i{color:var(--gold)}

/* ── Вкладки и управление ───────────────────────────────────────────── */
.vn-mapwrap{position:relative;margin:14px 0 12px}
.vn-map{position:relative;height:320px;overflow:hidden;border:1px solid var(--line);border-radius:16px}
.vn-map.is-picking{box-shadow:inset 0 0 0 2px var(--gold)}
.vn-tip{position:absolute;z-index:7;left:10px;right:10px;top:10px;margin:0;padding:10px 13px;
  font-size:.78rem;line-height:1.4;color:#fff;border-radius:10px;background:rgba(12,10,6,.9);
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
.vn-bar{display:flex;gap:8px;margin-bottom:12px}
.vn-bar button{flex:1;min-height:46px;border:1px solid var(--line);border-radius:999px;background:transparent;
  color:inherit;font:inherit;cursor:pointer}
.vn-bar button.on{color:#170f02;border-color:transparent;background:linear-gradient(112deg,var(--lilac-d),var(--gold))}
.vn-new{display:grid;gap:8px;padding:14px;margin-bottom:12px;border:1px solid var(--gold);border-radius:14px}
.vn-new .coords{font-size:.76rem;color:var(--soft)}
.vn-new-act{display:flex;gap:8px}
.vn-new-act button{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer}
.vn-new-act button.ok{color:#170f02;border-color:transparent;background:linear-gradient(112deg,var(--lilac-d),var(--gold))}
.vn{display:grid;gap:8px;padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px}
.vn.is-target{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.16)}
.vn-move{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--soft);cursor:pointer}
.vn.draft{border-style:dashed;opacity:.86}
.vn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vn input,.vn select{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
  background:transparent;color:inherit;font:inherit}
.vn-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vn-foot label{display:flex;flex:1;min-width:0;align-items:center;gap:9px;font-size:.78rem;line-height:1.35;color:var(--soft)}
.vn-foot label input{flex:0 0 18px;width:18px;height:18px;margin:0}
.vn-del{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--soft)}
.vn-add{width:100%;min-height:46px;margin-bottom:14px;border:1px dashed var(--line);border-radius:14px;
  background:transparent;color:inherit;font:inherit}
.tabs{display:flex;gap:6px;margin:18px 0 4px;padding:4px;border:1px solid var(--line);border-radius:999px;
  background:linear-gradient(158deg,rgba(255,248,232,.07),rgba(5,4,8,.2))}
.tabs button{flex:1;min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--soft);
  font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:color .3s ease,background .3s ease}
.tabs button.on{color:#170f02;background:linear-gradient(112deg,var(--lilac-d),var(--gold))}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.filters button{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--soft);font:inherit;font-size:.78rem;cursor:pointer}
.filters button.on{color:var(--gold);border-color:var(--gold);background:rgba(230,207,154,.1)}
.order-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:transform .15s ease,background .3s ease}
.act:active{transform:scale(.97)}
.act[disabled]{opacity:.45;cursor:default}
.act--pay{color:#170f02;border-color:transparent;background:linear-gradient(112deg,var(--lilac-d),var(--gold))}
.act--cancel{color:var(--err);border-color:rgba(224,140,153,.4)}
.act--link{color:var(--gold);border-color:rgba(230,207,154,.35)}
.order-contacts{margin-top:8px;font-size:.8rem;color:var(--soft);word-break:break-word}
.price-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.price-row:last-child{border-bottom:0}
.price-row .nm{flex:1;min-width:0;font-size:.9rem;font-weight:600}
.price-row .nm em{display:block;font-style:normal;font-size:.72rem;font-weight:400;color:var(--soft)}
.price-row input{width:130px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,248,232,.06);color:var(--ink);font:inherit;font-size:.9rem;text-align:right}
.price-row input:focus{outline:0;border-color:var(--gold);background:rgba(230,207,154,.1)}
.price-row.off .nm{opacity:.5}
.price-row.off input[type=number]{opacity:.5}
.tgl{display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;cursor:pointer;user-select:none}
.tgl input{position:absolute;opacity:0;width:0;height:0}
.tgl-track{position:relative;width:46px;height:27px;flex:0 0 46px;border-radius:999px;
  background:rgba(255,248,232,.14);transition:background .32s ease}
.tgl-knob{position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:transform .32s cubic-bezier(.32,0,.18,1)}
.tgl input:checked+.tgl-track{background:linear-gradient(105deg,var(--gold),#f3e2ba)}
.tgl input:checked+.tgl-track .tgl-knob{transform:translateX(19px)}
.tgl input:focus-visible+.tgl-track{outline:2px solid var(--gold);outline-offset:3px}
.tgl-lbl{min-width:74px;font-size:.74rem;color:var(--soft)}
.tgl input:checked~.tgl-lbl{color:var(--gold)}
.price-save{display:flex;align-items:center;gap:12px;margin-top:16px}
.note{margin-top:10px;font-size:.78rem;color:var(--soft);line-height:1.5}
.saved{color:var(--ok);font-size:.82rem}
.tx{padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px}
.tx.edited{border-color:rgba(230,207,154,.5)}
.tx-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tx-h .nm{flex:1;min-width:0;font-size:.88rem;font-weight:600}
.tx-h .key{font-size:.7rem;color:var(--soft);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tx textarea{width:100%;min-height:118px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,248,232,.06);color:var(--ink);font:inherit;font-size:.82rem;line-height:1.5;resize:vertical}
.tx textarea:focus{outline:0;border-color:var(--gold);background:rgba(230,207,154,.1)}
.tx-vars{margin-top:7px;font-size:.72rem;color:var(--soft);word-break:break-word}
.tx-vars code{padding:1px 5px;margin-right:4px;border-radius:5px;background:rgba(230,207,154,.12);color:var(--gold)}
.tx-reset{min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--soft);font:inherit;font-size:.74rem;cursor:pointer}
.tx-save{position:sticky;bottom:10px;z-index:4;display:flex;align-items:center;gap:12px;margin-top:16px;
  padding:10px;border-radius:999px;background:rgba(12,10,6,.86);backdrop-filter:blur(8px)}
.tx-save .act{flex:1}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:0 14px}
</style>
</head>

let LANG = localStorage.getItem('nv_admin_lang') || 'uz';
const t = (k) => (I18N[LANG][k] ?? k);
let DATA = null;
let TAB = localStorage.getItem('nv_admin_tab') || 'overview';
// Вкладки «Музыка» больше нет: запомненная она открывает показатели.
if (TAB === 'music') TAB = 'overview';
let FILTER = 'all';
let proofObjectUrls = [];

/* Шаги студии по порядку — тот же список, что и STEPS в public/app/app.js.
   Номер шага приходит с автосохранением черновика. */
const STEP_NAMES = {
  uz:['Ismlar','Sana','Manzil','Musiqa','Shablon','Suratlar','Ko‘rish','Mehmonlar','Aloqa'],
  ru:['Имена','Дата','Локация','Музыка','Шаблон','Фото','Просмотр','Гости','Контакты'],
};
const stepName = (i) => STEP_NAMES[LANG][i] || `${t('uStep')} ${i + 1}`;

function kpi(v, l, cls, badge){ return `<div class="kpi ${cls||''}"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div>${badge||''}</div>`; }

function statusBadge(s){
  if (s==='paid') return `<span class="badge b-paid">${t('stPaid')}</span>`;
  if (s==='cancelled') return `<span class="badge b-cnl">${t('stCancel')}</span>`;
  return `<span class="badge b-new">${t('stNew')}</span>`;
}

function templateNames(){
  const names = Object.create(null);
  for (const x of (DATA?.templates||[])) names[x.id]=x.name;
  return names;
}

/* ── Вкладка «Показатели» ── */
function renderOverview(){
  const s = DATA.stats, T = s.totals, names = templateNames();
  let h = '<div class="kpis">';
  h += kpi(T.all, t('kAll'));
  h += kpi(T.paid, t('kPaid'), '', '<span class="badge b-paid">✓</span>');
  h += kpi(T.new, t('kNew'), '', '<span class="badge b-new">⏳</span>');
  h += kpi(T.cancelled, t('kCancel'), '', '<span class="badge b-cnl">✕</span>');
  h += '</div><div class="kpis" style="margin-top:12px">';
  h += kpi(money(T.revenue), t('kRev'), 'k-rev wide');
  h += kpi(T.conversion+'%', t('kConv'));
  h += kpi(money(T.avgCheck), t('kAvg'));
  h += '</div><div class="kpis" style="margin-top:12px">';
  h += kpi(s.guestLinks, t('kGuests'));
  h += kpi(money(s.premiumRevenue), t('kGuestRev'), 'k-rev');
  h += '</div>';

  h += renderUsers();

  const maxT = Math.max(1, ...s.templates.map(x=>x.count));
  h += `<h2>${esc(t('hTpl'))}</h2><div class="card">`;
  if (!s.templates.length) h += `<div class="empty">${esc(t('noData'))}</div>`;
  for (const x of s.templates) h += `<div class="row"><div class="nm">${esc(names[x.id]||x.id)}</div>
    <div class="track"><div class="fill" style="width:${(x.count/maxT*100).toFixed(1)}%"></div></div>
    <div class="val">${esc(x.count)} · ${esc(money(x.revenue))}</div></div>`;
  h += '</div>';

  h += `<h2>${esc(t('hDays'))}</h2><div class="card">`;
  if (!s.byDay.length) h += `<div class="empty">${esc(t('noData'))}</div>`;
  else {
    const maxD = Math.max(1, ...s.byDay.map(d=>d.count));
    h += '<div class="days">';
    for (const d of s.byDay){ const hh=(d.count/maxD*100).toFixed(0); const ph=d.count?(d.paid/d.count*100).toFixed(0):0;
      h += `<div class="day" title="${esc(`${d.day}: ${d.count} / ${d.paid}`)}"><div class="bar" style="height:${hh}%"><div class="paid" style="height:${ph}%"></div></div><div class="d">${esc(String(d.day).slice(5))}</div></div>`; }
    h += `</div><div class="legend"><span><i class="dot" style="background:var(--mist)"></i>${esc(t('legReq'))}</span><span><i class="dot" style="background:var(--lilac)"></i>${esc(t('legPaid'))}</span></div>`;
  }
  h += '</div>';

  h += `<h2>${esc(t('hMusic'))}</h2><div class="card">`;
  if (!s.topMusic.length) h += `<div class="empty">${esc(t('noMusic'))}</div>`;
  s.topMusic.forEach((m,i)=>{ h += `<div class="mline"><span class="n">${i+1}</span><div class="t"><b>${esc(m.name)}</b><span>${esc(m.artist)}</span></div><span class="c">${esc(m.count)}×</span></div>`; });
  h += '</div>';
  return h;
}

/* Люди, а не заявки: сколько всего заходило, у скольких висит незаконченный
   черновик и на каком шаге они остановились. */
function renderUsers(){
  const u = DATA.users;
  if (!u) return '';
  let h = `<h2>${esc(t('hUsers'))}</h2><div class="kpis">`;
  h += kpi(u.total, t('uAll'));
  h += kpi(u.drafts, t('uDraft'), '', '<span class="badge b-new">✎</span>');
  h += kpi(u.stuck, t('uStuck'));
  h += kpi(u.ordered, t('uOrdered'));
  h += '</div><div class="kpis" style="margin-top:12px">';
  h += kpi(u.buyers, t('uBuyers'), '', '<span class="badge b-paid">✓</span>');
  h += kpi(u.today, t('uToday'));
  h += kpi(u.week, t('uWeek'));
  h += '</div><div class="kpis" style="margin-top:12px">';
  h += kpi(u.started, t('uBot'));
  h += kpi(u.opened, t('uStudio'));
  h += '</div>';

  h += `<h2>${esc(t('uSteps'))}</h2><div class="card">`;
  const steps = u.draftSteps || [];
  if (!steps.length) h += `<div class="empty">${esc(t('uNoDrafts'))}</div>`;
  else {
    const max = Math.max(1, ...steps.map(x=>x.count));
    for (const x of steps) h += `<div class="row"><div class="nm">${esc(stepName(x.step))}</div>
      <div class="track"><div class="fill" style="width:${(x.count/max*100).toFixed(1)}%"></div></div>
      <div class="val">${esc(x.count)}</div></div>`;
  }
  h += '</div>';
  return h;
}

/* ── Вкладка «Тексты»: всё, что бот отправляет сообщением ── */
function renderTexts(){
  const data = DATA.texts;
  if (!data) return `<div class="card"><div class="empty">${esc(t('noData'))}</div></div>`;
  let h = `<p class="note">${esc(t('txNote'))}</p>`;
  for (const group of data.groups){
    const items = data.items.filter(x=>x.group===group.id);
    if (!items.length) continue;
    h += `<h2>${esc(group[LANG] || group.ru)}</h2>`;
    for (const item of items){
      const label = item.label[LANG] || item.label.ru;
      h += `<div class="tx${item.value?' edited':''}" data-tx="${esc(item.key)}">
        <div class="tx-h"><div class="nm">${esc(label)}</div><span class="key">${esc(item.key)}</span>
          <button class="tx-reset" data-tx-reset="${esc(item.key)}">${esc(t('txReset'))}</button></div>
        <textarea rows="6" data-tx-value="${esc(item.key)}" placeholder="${esc(item.defaultValue)}">${esc(item.value)}</textarea>`;
      if (item.vars.length) h += `<div class="tx-vars">${esc(t('txVars'))} ${item.vars.map(v=>`<code>{${esc(v)}}</code>`).join('')}</div>`;
      h += '</div>';
    }
  }
  h += `<div class="tx-save"><button class="act act--pay" id="texts-save">${esc(t('txSave'))}</button>
    <span class="saved" id="texts-saved" hidden>${esc(t('saved'))}</span></div>`;
  return h;
}

/* ── Вкладка «Заявки»: чек, контакты и два действия ── */
function renderOrders(){
  const names = templateNames();
  const all = DATA.orders || [];
  const orders = FILTER==='all' ? all : all.filter(o=>o.status===FILTER);
  let h = '<div class="filters">';
  for (const [key,label] of [['all','fAll'],['new','fNew'],['paid','fPaid'],['cancelled','fCancel']]) {
    const count = key==='all' ? all.length : all.filter(o=>o.status===key).length;
    h += `<button data-filter="${key}" class="${FILTER===key?'on':''}">${esc(t(label))} · ${count}</button>`;
  }
  h += '</div>';

  if (!orders.length) return h + `<div class="card"><div class="empty">${esc(t('noOrders'))}</div></div>`;

  for (const o of orders){
    h += `<div class="order"><div class="order-h"><div><div class="nm">#${esc(o.id)} · ${esc(o.groom)} &amp; ${esc(o.bride)}</div>
      <div class="order-meta">${esc(o.date)} · ${esc(names[o.templateId]||o.templateId)} · ${esc(money(o.total))}</div></div>${statusBadge(o.status)}</div>`;
    const contacts = [o.contactTg ? '@'+String(o.contactTg).replace(/^@/,'') : '', o.phone, o.phone2].filter(Boolean);
    if (contacts.length) h += `<div class="order-contacts">${esc(t('contacts'))}: ${esc(contacts.join(' · '))}</div>`;
    if (o.status==='paid' && (o.confirmedByName || o.paidAt)) {
      h += `<div class="order-conf">✅ ${esc(t('confBy'))}: <b>${esc(o.confirmedByName||'—')}</b>${o.paidAt?` · ${esc(o.paidAt)}`:''}</div>`;
    }
    if (o.paymentProof) h += `<a class="order-proof" data-proof-link href="#" target="_blank" rel="noopener"><img data-proof-src="${esc(o.paymentProof)}" alt="${esc(t('proof'))}"></a>`;
    if (o.guests && o.guests.length){
      h += '<div class="order-guests">';
      for (const g of o.guests) h += `<span class="gtag ${g.sent?'sent':''}">${g.sent?'✅':'⚪'} ${esc(g.name)}</span>`;
      h += '</div>';
    }
    h += '<div class="order-acts">';
    if (o.status==='new'){
      h += `<button class="act act--pay" data-pay="${esc(o.id)}">${esc(t('pay'))}</button>`;
      h += `<button class="act act--cancel" data-cancel="${esc(o.id)}">${esc(t('cancel'))}</button>`;
    }
    if (o.status==='paid' && o.slug){
      h += `<a class="act act--link" href="/${esc(o.slug)}" target="_blank" rel="noopener">${esc(t('openLink'))}</a>`;
    }
    h += '</div></div>';
  }
  return h;
}

/* ── Вкладка «Цены» ── */
function renderPricing(){
  const p = DATA.pricing;
  let h = `<h2>${esc(t('priceTpl'))}</h2><div class="card">`;
  for (const tpl of p.templates){
    h += `<div class="price-row${tpl.listed?'':' off'}" data-row="${esc(tpl.id)}">
      <div class="nm">${esc(tpl.name)}<em>${esc(t('factory'))}: ${esc(money(tpl.defaultPrice))}</em></div>
      <label class="tgl" title="${esc(t('tplOnAria'))}">
        <input type="checkbox" data-listed-template="${esc(tpl.id)}"${tpl.listed?' checked':''} aria-label="${esc(t('tplOnAria'))}">
        <span class="tgl-track"><span class="tgl-knob"></span></span>
        <span class="tgl-lbl">${esc(tpl.listed?t('tplOn'):t('tplOff'))}</span>
      </label>
      <input type="number" inputmode="numeric" min="0" step="1000" data-price-template="${esc(tpl.id)}" value="${esc(tpl.price)}" placeholder="${esc(tpl.defaultPrice)}"></div>`;
  }
  h += '</div>';
  h += `<p class="note">${esc(t('tplHiddenNote'))}</p>`;

  h += `<h2>${esc(t('priceOther'))}</h2><div class="card">`;
  h += `<div class="price-row"><div class="nm">${esc(t('guestLink'))}<em>${esc(t('factory'))}: ${esc(money(p.guestLink.defaultPrice))}</em></div>
    <input type="number" inputmode="numeric" min="0" step="1000" data-price-guest value="${esc(p.guestLink.price)}" placeholder="${esc(p.guestLink.defaultPrice)}"></div>`;
  for (const addon of p.addons){
    h += `<div class="price-row"><div class="nm">${esc(LANG==='ru'?addon.ru:addon.uz)}<em>${esc(t('factory'))}: ${esc(money(addon.defaultPrice))}</em></div>
      <input type="number" inputmode="numeric" min="0" step="1000" data-price-addon="${esc(addon.id)}" value="${esc(addon.price)}" placeholder="${esc(addon.defaultPrice)}"></div>`;
  }
  h += '</div>';
  h += `<div class="price-save"><button class="act act--pay" id="price-save">${esc(t('save'))}</button><span class="saved" id="price-saved" hidden>${esc(t('saved'))}</span></div>`;
  h += `<p class="note">${esc(t('priceNote'))}</p>`;
  return h;
}

/* Справочник тойхон. Каждая запись — карточка с полями; сохраняем весь
   список одной кнопкой: он короткий, склеивать правки построчно незачем. */
function venueCard(v, i){
  const kinds = t('vnKinds');
  const options = Object.keys(kinds)
    .map(k=>`<option value="${esc(k)}"${k===v.kind?' selected':''}>${esc(kinds[k])}</option>`).join('');
  return `<div class="vn${v.draft?' draft':''}" data-vn="${i}">
    <div class="vn-row">
      <input data-f="name" value="${esc(v.name)}" placeholder="${esc(t('vnName'))}" aria-label="${esc(t('vnName'))}">
      <select data-f="kind" aria-label="${esc(t('vnKind'))}">${options}</select>
    </div>
    <input data-f="address" value="${esc(v.address)}" placeholder="${esc(t('vnAddr'))}" aria-label="${esc(t('vnAddr'))}">
    <div class="vn-row">
      <input data-f="lat" inputmode="decimal" value="${esc(v.lat)}" placeholder="${esc(t('vnLat'))}" aria-label="${esc(t('vnLat'))}">
      <input data-f="lng" inputmode="decimal" value="${esc(v.lng)}" placeholder="${esc(t('vnLng'))}" aria-label="${esc(t('vnLng'))}">
    </div>
    <div class="vn-row">
      <input data-f="seats" inputmode="numeric" value="${esc(v.seats||'')}" placeholder="${esc(t('vnSeats'))}" aria-label="${esc(t('vnSeats'))}">
      <input data-f="phone" value="${esc(v.phone)}" placeholder="${esc(t('vnPhone'))}" aria-label="${esc(t('vnPhone'))}">
    </div>
    <div class="vn-foot">
      <label><input type="checkbox" data-f="draft"${v.draft?' checked':''}> ${esc(t('vnDraft'))}</label>
      <button class="vn-move" data-vn-move="${i}">${esc(t('vnMove'))}</button>
      <button class="vn-del" data-vn-del="${i}">${esc(t('vnDel'))}</button>
    </div>
  </div>`;
}

function renderVenues(){
  const list = DATA?.venues || [];
  let h = `<h2>${esc(t('vnTitle'))}</h2>`;
  h += `<p class="note">${esc(t('vnNote'))}</p>`;
  h += `<div class="vn-mapwrap"><div class="vn-map" id="vn-map"></div><p class="vn-tip" id="vn-tip" hidden></p></div>`;
  h += `<button class="vn-add" id="vn-add">${esc(t('vnAdd'))}</button>`;
  h += `<div id="vn-new-slot"></div>`;
  h += list.length ? list.map(venueCard).join('') : `<div class="empty">${esc(t('vnEmpty'))}</div>`;
  h += `<div class="price-save"><button class="act act--pay" id="vn-save">${esc(t('save'))}</button><span class="saved" id="vn-saved" hidden>${esc(t('saved'))}</span></div>`;
  h += `<p class="note">${esc(t('vnHowto'))}</p>`;
  return h;
}

/* ── Карта справочника ────────────────────────────────────────────────────
   Координаты руками не пишут: админ нажимает на карту, подписывает точку и
   подтверждает. Карта своя (map.js) — та же, что у пар в студии. */

let vnMap = null;          // экземпляр карты текущей отрисовки
let vnMode = null;         // null | 'add' | {move: index}
let vnDraft = null;        // черновик новой точки до подтверждения

function vnPins(){
  return (DATA?.venues || []).map((v, i) => ({
    id: String(i), lat: Number(v.lat), lng: Number(v.lng), label: v.name || '—',
    active: vnMode && vnMode.move === i,
  })).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
}

function vnTip(text){
  const tip = $('vn-tip');
  if (!tip) return;
  tip.hidden = !text;
  tip.textContent = text || '';
}

function vnPaintMap(){
  if (!vnMap) return;
  vnMap.setPins(vnPins());
  if (vnDraft) vnMap.setMark(vnDraft.lat, vnDraft.lng); else vnMap.clearMark();
}

function vnSetMode(mode){
  vnMode = mode;
  const box = $('vn-map');
  if (box) box.classList.toggle('is-picking', Boolean(mode));
  vnMap?.setPick(Boolean(mode));
  vnTip(!mode ? '' : mode === 'add' ? t('vnAddTip') : t('vnMoveTip'));
  vnPaintMap();
}

function vnNewCard(){
  const kinds = t('vnKinds');
  const options = Object.keys(kinds).map(k=>`<option value="${esc(k)}">${esc(kinds[k])}</option>`).join('');
  return `<div class="vn-new" id="vn-new">
    <b>${esc(t('vnNew'))}</b>
    <input data-n="name" placeholder="${esc(t('vnName'))}" aria-label="${esc(t('vnName'))}">
    <div class="vn-row">
      <select data-n="kind" aria-label="${esc(t('vnKind'))}">${options}</select>
      <input data-n="seats" inputmode="numeric" placeholder="${esc(t('vnSeats'))}" aria-label="${esc(t('vnSeats'))}">
    </div>
    <input data-n="address" placeholder="${esc(t('vnAddr'))}" aria-label="${esc(t('vnAddr'))}">
    <input data-n="phone" placeholder="${esc(t('vnPhone'))}" aria-label="${esc(t('vnPhone'))}">
    <span class="coords">${esc(vnDraft.lat.toFixed(5))}, ${esc(vnDraft.lng.toFixed(5))}</span>
    <div class="vn-new-act">
      <button id="vn-new-cancel">${esc(t('vnCancel'))}</button>
      <button class="ok" id="vn-new-ok">${esc(t('vnOk'))}</button>
    </div>
  </div>`;
}

function vnShowDraft(){
  const slot = $('vn-new-slot');
  if (!slot) return;
  slot.innerHTML = vnDraft ? vnNewCard() : '';
  if (vnDraft) slot.querySelector('[data-n="name"]')?.focus();
}

function vnMountMap(){
  const box = $('vn-map');
  if (!box || !window.NvMap) return;
  const city = DATA?.city || {};
  vnMap = NvMap.create(box, {
    lat: Number(city.lat) || 42.116169,
    lng: Number(city.lng) || 60.0625143,
    zoom: Number(city.zoom) || 14,
    tiles: DATA?.mapTiles || undefined,
    tone: 'light',
    onPin: (pin) => {
      const card = document.querySelector(`[data-vn="${pin.id}"]`);
      if (!card) return;
      document.querySelectorAll('.vn.is-target').forEach(el=>el.classList.remove('is-target'));
      card.classList.add('is-target');
      card.scrollIntoView({ block:'center', behavior:'smooth' });
    },
    onPick: ({ lat, lng }) => {
      if (vnMode === 'add'){
        vnDraft = { lat, lng };
        vnShowDraft();
        vnPaintMap();
        return;
      }
      if (vnMode && Number.isInteger(vnMode.move)){
        const card = document.querySelector(`[data-vn="${vnMode.move}"]`);
        if (card){
          card.querySelector('[data-f="lat"]').value = lat.toFixed(6);
          card.querySelector('[data-f="lng"]').value = lng.toFixed(6);
        }
        DATA.venues = collectVenues();
        vnSetMode(null);
        render();
      }
    },
  });
  const pins = vnPins();
  if (pins.length) vnMap.fit(pins);
  vnPaintMap();
}

const TAB_LABEL = { overview:'tabOverview', orders:'tabOrders', pricing:'tabPricing', venues:'tabVenues', texts:'tabTexts' };

function render(){
  if (!DATA) return;
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===TAB);
    b.textContent = t(TAB_LABEL[b.dataset.tab] || 'tabOverview');
  });
  $('content').innerHTML = TAB==='orders' ? renderOrders()
    : TAB==='pricing' ? renderPricing()
    : TAB==='venues' ? renderVenues()
    : TAB==='texts' ? renderTexts()
    : renderOverview();
  if (TAB==='orders') loadProofs();
  if (TAB==='venues'){
    vnMap = null;
    vnMountMap();
    vnShowDraft();
    vnSetMode(vnMode);
  }
}

// Правки собираем из полей в момент сохранения: следить за каждым вводом
// незачем, а верстка не перерисовывается под пальцем.
function collectVenues(){
  return [...document.querySelectorAll('[data-vn]')].map(card=>{
    const get = (f)=>card.querySelector(`[data-f="${f}"]`);
    return {
      id: (DATA.venues[Number(card.dataset.vn)] || {}).id || '',
      name: get('name').value,
      kind: get('kind').value,
      address: get('address').value,
      lat: Number(get('lat').value.replace(',', '.')),
      lng: Number(get('lng').value.replace(',', '.')),
      seats: Number(get('seats').value) || 0,
      phone: get('phone').value,
      draft: get('draft').checked,
    };
  });
}

async function saveVenues(){
  const button = $('vn-save');
  button.disabled = true;
  try {
    const res = await fetch('/api/admin/venues', {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Init-Data': initData() },
      body: JSON.stringify({ venues: collectVenues() }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'error');
    DATA.venues = data.venues;
    render();
    const saved = $('vn-saved');
    if (saved) { saved.hidden = false; setTimeout(()=>{ const el=$('vn-saved'); if (el) el.hidden = true; }, 2600); }
  } catch(e){
    alert(e.message || t('loadErr'));
  } finally {
    const el = $('vn-save');
    if (el) el.disabled = false;
  }
}

async function loadProofs(){
  proofObjectUrls.forEach((url)=>URL.revokeObjectURL(url));
  proofObjectUrls = [];
  for (const img of document.querySelectorAll('img[data-proof-src]')) {
    try {
      const response = await fetch(img.dataset.proofSrc, { headers:{ 'X-Init-Data': initData() } });
      if (!response.ok) continue;
      const objectUrl = URL.createObjectURL(await response.blob());
      proofObjectUrls.push(objectUrl);
      img.src = objectUrl;
      const link = img.closest('[data-proof-link]');
      if (link) link.href = objectUrl;
    } catch (_) { /* чек остаётся скрытым, если доступ не подтверждён */ }
  }
}

async function load(){
  $('content').innerHTML = '<div class="empty">…</div>';
  try {
    const res = await fetch('/api/admin/overview', { headers:{ 'X-Init-Data': initData() } });
    if (res.status===403){ $('content').innerHTML = `<div class="err-screen"><div class="big">🔒</div>${t('forbidden')}</div>`; return; }
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error();
    DATA = data;
    try {
      const catalog = await (await fetch('/api/admin/venues', { headers:{ 'X-Init-Data': initData() } })).json();
      DATA.venues = catalog.ok ? catalog.venues : [];
      DATA.city = catalog.city || null;
      DATA.mapTiles = catalog.mapTiles || null;
    } catch (_) { DATA.venues = []; }
    render();
  } catch(e){ $('content').innerHTML = `<div class="err-screen"><div class="big">📡</div>${t('loadErr')}</div>`; }
}

/* Действия над заявкой: подтверждение необратимо, поэтому спрашиваем. */
async function act(id, kind){
  const ask = kind==='pay' ? t('payAsk') : t('cancelAsk');
  if (!confirm(ask)) return;
  const button = document.querySelector(`[data-${kind}="${id}"]`);
  if (button) button.disabled = true;
  try {
    const res = await fetch(`/api/admin/applications/${id}/${kind}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Init-Data': initData() },
      body:'{}',
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'error');
    alert(kind==='pay' ? t('payOk') : t('cancelOk'));
    await load();
  } catch(e){
    alert(e.message || t('loadErr'));
    if (button) button.disabled = false;
  }
}

async function savePricing(){
  const patch = { templates:{}, addons:{}, listed:{} };
  document.querySelectorAll('[data-price-template]').forEach(i=>{ patch.templates[i.dataset.priceTemplate] = i.value===''?null:Number(i.value); });
  document.querySelectorAll('[data-price-addon]').forEach(i=>{ patch.addons[i.dataset.priceAddon] = i.value===''?null:Number(i.value); });
  patch.listed = {};
  document.querySelectorAll('[data-listed-template]').forEach(i=>{ patch.listed[i.dataset.listedTemplate] = i.checked; });
  if (!Object.values(patch.listed).some(Boolean)) { alert(t('tplLastOn')); return; }
  const guest = document.querySelector('[data-price-guest]');
  patch.guestLink = guest && guest.value!=='' ? Number(guest.value) : null;
  const button = $('price-save');
  button.disabled = true;
  try {
    const res = await fetch('/api/admin/pricing', {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Init-Data': initData() },
      body: JSON.stringify(patch),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'error');
    DATA.pricing = data.pricing;
    $('price-saved').hidden = false;
    setTimeout(()=>{ const el=$('price-saved'); if (el) el.hidden = true; }, 2600);
  } catch(e){
    alert(e.message || t('loadErr'));
  } finally {
    button.disabled = false;
  }
}

/* Правки собираем из полей в момент сохранения — как и в ценах: следить за
   каждым нажатием незачем, а пустое поле возвращает заводской текст. */
async function saveTexts(){
  const patch = {};
  document.querySelectorAll('[data-tx-value]').forEach(area=>{ patch[area.dataset.txValue] = area.value; });
  const button = $('texts-save');
  button.disabled = true;
  try {
    const res = await fetch('/api/admin/texts', {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Init-Data': initData() },
      body: JSON.stringify(patch),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'error');
    DATA.texts = data.texts;
    render();
    const saved = $('texts-saved');
    if (saved){ saved.hidden = false; setTimeout(()=>{ const el=$('texts-saved'); if (el) el.hidden = true; }, 2600); }
  } catch(e){
    alert(e.message || t('loadErr'));
  } finally {
    const el = $('texts-save');
    if (el) el.disabled = false;
  }
}

/* Выключатель витрины отвечает сразу: подпись и блёклость строки меняются
   на месте, сохранение — общей кнопкой, как и цены. */
document.addEventListener('change', (e)=>{
  const box = e.target.closest('[data-listed-template]');
  if (!box) return;
  const row = box.closest('.price-row');
  if (row) row.classList.toggle('off', !box.checked);
  const label = box.parentElement.querySelector('.tgl-lbl');
  if (label) label.textContent = box.checked ? t('tplOn') : t('tplOff');
});

document.addEventListener('click', (e)=>{
  const tab = e.target.closest('#tabs button');
  if (tab){ TAB = tab.dataset.tab; localStorage.setItem('nv_admin_tab', TAB); render(); return; }
  const filter = e.target.closest('[data-filter]');
  if (filter){ FILTER = filter.dataset.filter; render(); return; }
  const pay = e.target.closest('[data-pay]');
  if (pay){ act(pay.dataset.pay, 'pay'); return; }
  const cancel = e.target.closest('[data-cancel]');
  if (cancel){ act(cancel.dataset.cancel, 'cancel'); return; }
  if (e.target.closest('#price-save')) { savePricing(); return; }
  const txReset = e.target.closest('[data-tx-reset]');
  if (txReset){
    const area = document.querySelector(`[data-tx-value="${txReset.dataset.txReset}"]`);
    if (area){ area.value = ''; area.closest('.tx')?.classList.remove('edited'); }
    return;
  }
  if (e.target.closest('#texts-save')) { saveTexts(); return; }
  const del = e.target.closest('[data-vn-del]');
  if (del){
    const edited = collectVenues();
    edited.splice(Number(del.dataset.vnDel), 1);
    DATA.venues = edited;
    vnMode = null;
    render();
    return;
  }
  if (e.target.closest('#vn-add')){
    DATA.venues = collectVenues();
    vnDraft = null;
    vnShowDraft();
    vnSetMode(vnMode === 'add' ? null : 'add');
    return;
  }
  const move = e.target.closest('[data-vn-move]');
  if (move){
    DATA.venues = collectVenues();
    vnSetMode({ move: Number(move.dataset.vnMove) });
    document.querySelector('.vn-mapwrap')?.scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }
  if (e.target.closest('#vn-new-cancel')){
    vnDraft = null;
    vnShowDraft();
    vnSetMode(null);
    return;
  }
  if (e.target.closest('#vn-new-ok')){
    const card = $('vn-new');
    const get = (n)=>card.querySelector(`[data-n="${n}"]`).value;
    if (!get('name').trim()){ alert(t('vnNoName')); return; }
    DATA.venues = [...collectVenues(), {
      id:'', name:get('name'), kind:get('kind'), address:get('address'),
      lat:vnDraft.lat, lng:vnDraft.lng, seats:Number(get('seats'))||0,
      phone:get('phone'), draft:false,
    }];
    vnDraft = null;
    vnSetMode(null);
    render();
    saveVenues();
    return;
  }
  if (e.target.closest('#vn-save')) saveVenues();
});

function applyLang(){
  document.documentElement.lang = LANG;
  $('refresh').textContent = t('refresh');
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('on', b.dataset.lang===LANG));
  render();
}
document.querySelectorAll('.lang-switch button').forEach(b=>b.addEventListener('click',()=>{ LANG=b.dataset.lang; localStorage.setItem('nv_admin_lang',LANG); applyLang(); }));
$('refresh').addEventListener('click', load);
applyLang();
load();
</script>
</body>
