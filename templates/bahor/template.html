<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{groom}} &amp; {{bride}} — {{L.sub}}</title>
    {{{experienceCSS}}}{{{luxuryHead}}}
  </head>
  <body data-template="bahor">
    {{{luxuryEnvelope}}}
    <main class="paper" id="invitation" tabindex="-1">
      <section class="hero hero-bahor">
        {{{luxuryScene}}}
        <div class="hero-card">
          <span class="small-label">{{L.sub}}</span>
          <h1><span>{{groom}}</span><i>&amp;</i><span>{{bride}}</span></h1>
          <div class="botanical-date">
            <span>{{day}}</span><i>·</i><span>{{monthName}}</span><i>·</i
            ><span>{{year}}</span>
          </div>
          <p class="hero-time">{{time}}</p>
        </div>
        <a class="scroll-hint" href="#letter">↓</a>
      </section>
      <div class="invitation-content" id="letter">
        {{{luxuryLetter}}}{{{luxuryGallery}}}{{{luxuryDate}}}{{{luxuryVenue}}}{{{luxuryFooter}}}
      </div>
    </main>
    {{{audioWidget}}}{{{experienceScript}}}{{{countdown}}}
  </body>
</html>
