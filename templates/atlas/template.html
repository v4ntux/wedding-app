<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{groom}} &amp; {{bride}} — {{L.sub}}</title>
    {{{experienceCSS}}}{{{luxuryHead}}}
  </head>
  <body data-template="atlas">
    {{{luxuryEnvelope}}}
    <main class="paper" id="invitation" tabindex="-1">
      <section class="hero hero-atlas">
        {{{luxuryScene}}}
        <div class="hero-card">
          <span class="small-label">{{L.sub}}</span>
          <h1><span>{{groom}}</span><i>&amp;</i><span>{{bride}}</span></h1>
          <span class="gold-rule"></span>
          <p class="hero-date">{{dateText}}</p>
          <span class="hero-time">{{time}}</span>
          <p class="hero-dedication">{{L.sign}}</p>
        </div>
        <a class="scroll-hint" href="#letter">↓</a>
      </section>
      <div class="invitation-content" id="letter">
        {{{luxuryLetter}}}{{{luxuryDate}}}{{{luxuryGallery}}}{{{luxuryVenue}}}{{{luxuryFooter}}}
      </div>
    </main>
    {{{audioWidget}}}{{{experienceScript}}}{{{countdown}}}
  </body>
</html>
